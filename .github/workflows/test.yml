name: Test and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 desktop-file-utils
      - run: python -m pip install -c packaging/build-constraints.txt -e '.[dev,packaging]'
      - run: python -m ruff check src tests scripts
      - name: Prepare test artifacts directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - run: python -m pytest -q --basetemp=artifacts/pytest-temp --junitxml=artifacts/tests.xml
      - name: Build testing packages
        if: matrix.python == '3.12'
        run: python scripts/build.py
      - name: Windows packaged smoke
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python scripts/smoke_bundle.py dist/Square-Photo-Padder/Square-Photo-Padder.exe artifacts/smoke
      - name: Linux packaged smoke
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python scripts/smoke_bundle.py dist/square-photo-padder/square-photo-padder artifacts/native
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/Square-Photo-Padder-x86_64.AppImage artifacts/appimage
          PADDER_SMOKE_PLATFORM=xcb APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke_bundle.py dist/Square-Photo-Padder-x86_64.AppImage artifacts/x11
      # Private release-stage.yml retains complete tested packages and QA as draft
      # release assets. Routine CI verifies without consuming Actions artifact quota.
