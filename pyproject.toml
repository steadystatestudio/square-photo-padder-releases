[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "square-photo-padder"
version = "1.4.4"
description = "Desktop app for padding photos to square images without cropping anything out."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "Pillow>=13.0.0",
  # Qt 6.12 fixes stale QLayoutItem parenting (PYSIDE-3469).
  # Python 3.12+ avoids the verified Linux/Python 3.11 None-refcount defect.
  "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.4.0",
]
packaging = [
  "PyInstaller>=6.11.0",
]

[project.scripts]
square-photo-padder = "photocropper.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photocropper = ["assets/*.png"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
